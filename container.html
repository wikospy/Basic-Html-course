<!-- ## 6. Basic containers -->
<!-- `div` is a generic block container; `span` is a generic inline container. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="card">
        <h2>News</h2>
        <p>Latest update.</p>
    </div>
    <p>Save <span class="keyboard-key">Ctrl + S</span>.</p>
</body>

</html>


<!-- **Example:** A `div` groups a card for styling; a `span` marks one phrase inside a sentence. -->
<!-- **Use / do not use:** Use these only when no semantic element fits. Do not replace `nav`, `article`, or `button` with a -->
