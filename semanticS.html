<!-- ## 7. Basic semantic structure -->
<!-- Semantic elements describe a page region to browsers and assistive technology. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>Brand and page heading</header>
    <nav aria-label="Primary"><a href="/">Home</a></nav>
    <main>
        <section>
            <h2>News</h2>
            <article>
                <h3>Update</h3>
            </article>
        </section>
    </main>
    <footer>Copyright information</footer>
</body>

</html>

<!-- **Example:** A blog page uses `main` for its unique content, `article` for each post, and `footer` for site-wide -->
<!-- information. -->

<!-- **Use / do not use:** Use the element whose meaning matches the content. Do not add landmarks just to make markup look -->
<!-- sophisticated. -->
