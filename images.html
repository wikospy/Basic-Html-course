<!-- ## 4. Images -->
<!-- `img` embeds an image; `alt` supplies its text alternative. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <img src="images/coffee.jpg" alt="A cup of coffee on a wooden table" width="640" height="480">
</body>

</html>

<!-- **Example:** A decorative divider can use `alt=""`; an informative product photo needs a useful description. -->

<!-- **Use / do not use:** Always provide `alt`. Use real dimensions to reduce layout shifts. Do not put important text only -->
