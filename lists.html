<!-- ## 5. Lists -->
<!-- Use unordered lists for unordered items, ordered lists for sequence, and description lists for term/value pairs. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul>
        <li>Tea</li>
        <li>Coffee</li>
    </ul>
    <ol>
        <li>Open the app</li>
        <li>Sign in</li>
    </ol>
    <dl>
        <dt>HTML</dt>
        <dd>A markup language for document structure.</dd>
    </dl>
</body>

</html>

<!-- **Example:** A recipe uses an unordered ingredient list and an ordered method list. -->
