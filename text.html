<!-- ## 2. Text -->
<!-- Headings communicate hierarchy; paragraphs group prose; `strong` and `em` communicate importance and emphasis. `b` and -->
<!-- `i` are presentational alternatives and should not replace meaning. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Recipe collection</h1>
    <h2>Vegetarian recipes</h2>
    <p>Use <strong>fresh</strong> ingredients and <em>read the instructions</em>.</p>
    <p>Water is H<sub>2</sub>O and 2<sup>3</sup> is 8.</p>
    <hr>
</body>

</html>
